[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imagefv-extractor"
version = "1.0.1"
description = "Extract bootloader and charging images from imagefv firmware blobs"
authors = [{ name = "chkndrp", email = "chkndrp@gmail.com" }]
keywords = [
    "android", "firmware", "imagefv", "qcom", "qualcomm",
    "uefi", "extractor", "bootloader", "charging", "research", 
    "cli", "library", "splash", "logo"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "uefi_firmware==1.16"
]
license = "LGPL-3.0"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/chkndrp/imagefv-extractor"
Issues     = "https://github.com/chkndrp/imagefv-extractor/issues"
Changelog  = "https://github.com/chkndrp/imagefv-extractor/blob/master/CHANGELOG.md"
Homepage = "https://github.com/chkndrp/imagefv-extractor/blob/master/README.md"

[project.scripts]
imagefv-extractor = "imagefv_extractor.cli:main"

[project.optional-dependencies]
dev = [
    "pylint~=4.0",
]

[tool.pylint.main]
py-version="3.10"
clear-cache-post-run = false
persistent = true
source-roots = ["src"]
load-plugins = [
    "pylint.extensions.check_elif",
    "pylint.extensions.for_any_all",
    "pylint.extensions.set_membership",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.typing",
    "pylint.extensions.comparison_placement"
]

[tool.pylint.classes]
check-protected-access-in-special-methods = true

[tool.pylint.format]
expected-line-ending-format = "LF"
ignore-long-lines = "^\\s*(# )?<?https?://\\S+>?$"
max-line-length = 110

[tool.pylint.string]
check-quote-consistency = true
check-str-concat-over-line-jumps = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagefv_extractor*"]

[tool.setuptools.package-data]
imagefv_extractor = ["py.typed"]
